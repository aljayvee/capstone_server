# Self-hosted OSRM routing engine.
#
# Deployment target for this project is a separate machine / VPS; the API server
# reaches it via OSRM_BASE_URL in server/.env (e.g. http://10.0.0.5:5001).
#
# Run build-graph.ps1 FIRST — osrm-routed only serves a pre-processed graph, and
# will exit immediately if ./data/tacurong.osrm is missing.
services:
  osrm:
    # GHCR, not Docker Hub. The project stopped publishing to docker.io at
    # v5.25.0 and its `latest` there is from July 2021; v5.27.1 is only on
    # GitHub Container Registry. Pulling the Docker Hub path fails outright with
    # "not found" rather than silently serving something older.
    #
    # This tag MUST match the one build-graph.ps1/.sh used. osrm-routed refuses
    # to load a graph written by a different version, so extract, partition,
    # customize and routed move together or not at all.
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    container_name: capstone-osrm
    restart: unless-stopped
    # SECURITY: osrm-routed has NO authentication or rate limiting whatsoever.
    # Anyone who can reach this port can use your routing server and read your
    # road graph. It must never be published to the open internet.
    #
    # Default binds to loopback only. On a VPS separate from the API server,
    # set OSRM_BIND to the private/VPN interface address (e.g. 10.0.0.5) and
    # firewall the port to the API server's IP — do NOT use 0.0.0.0.
    ports:
      - "${OSRM_BIND:-127.0.0.1}:5001:5000"
    volumes:
      - ./data:/data:ro
    # MLD is the algorithm the build script prepares (partition + customize).
    # max-matching-size raises the default 100-coordinate cap on /match so a
    # rider flushing a long offline backlog needs fewer chunked requests; the
    # adapter chunks regardless (see OSRM_MAX_MATCH_POINTS).
    command: >
      osrm-routed
      --algorithm mld
      --max-matching-size 500
      --max-table-size 1000
      /data/tacurong.osrm
    healthcheck:
      # Nearest is the cheapest service that still proves the graph is loaded.
      #
      # Probed with bash's /dev/tcp rather than an HTTP client, because this
      # image ships neither: no curl, no wget, no nc, no busybox, no python.
      # The original check ran `wget -qO- ...` and therefore failed every single
      # time with "wget: not found" - 22,463 consecutive failures by 2026-09-23,
      # while OSRM itself was answering perfectly. A healthcheck that can only
      # ever fail is worse than none: it trains everyone to ignore the column,
      # and any orchestration keyed on health would have restarted a working
      # container forever.
      #
      # CMD (not CMD-SHELL) with an explicit bash, because the default shell
      # here is dash, which has no /dev/tcp.
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/5000 && printf ''GET /nearest/v1/driving/124.6752,6.6873 HTTP/1.0\r\n\r\n'' >&3 && grep -q ''"code":"Ok"'' <&3'
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
